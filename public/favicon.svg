<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4AF2FF" />
      <stop offset="25%" style="stop-color:#BD34FE" />
      <stop offset="50%" style="stop-color:#FF3AC2" />
      <stop offset="75%" style="stop-color:#FF9800" />
      <stop offset="100%" style="stop-color:#F2FF44" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4" />
      <feOffset dx="0.2" dy="0.2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Lightning Bolt -->
  <path fill="url(#boltGrad)" filter="url(#shadow)"
    d="M22.502 0.136a1 1 0 0 1 0.454 1.16L19.354 13H26a1 1 0 0 1 0.728 1.686l-16 17a1 1 0 0 1-1.684-0.98L12.646 19H6a1 1 0 0 1-0.728-1.686l16-17a1 1 0 0 1 1.23-0.18z" />

  <!-- JPEG Badge -->
  <!-- Positioned to overlap the tail -->
  <rect x="15" y="21" width="16" height="10" rx="1.5" fill="#000" stroke="#FFF" stroke-width="0.75" />
  <text x="23" y="28.2" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#FFF"
    text-anchor="middle" letter-spacing="-0.2">JPEG</text>
</svg>